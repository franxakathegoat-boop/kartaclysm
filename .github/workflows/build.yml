name: build-launcher
on:
  push: { tags: ['launcher-v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet publish src/NitroMogger.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with: { name: launcher, path: out/MarioKartNitroMogger.exe }
      - if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" out/MarioKartNitroMogger.exe --title "Launcher $GITHUB_REF_NAME" --notes "Download MarioKartNitroMogger.exe and double-click it." --latest
